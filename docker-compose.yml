version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: caiai_audit
    ports:
      - '5432:5432'
    volumes:
      - ./data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  web:
    build: .
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/caiai_audit
      - REDIS_URL=redis://redis:6379/0
    ports:
      - '8000:8000'
    volumes:
      - .:/app

  worker:
    build: .
    command: celery -A src.worker.celery_app.worker worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/caiai_audit
      - REDIS_URL=redis://redis:6379/0
version: '3.8'

services:
  ciai-api:
    build: .
    container_name: ciai-api
    ports:
      - "8000:8000"
    volumes:
      - ./ciai_audit.db:/app/ciai_audit.db
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./ciai_audit.db
    restart: always

networks:
  default:
    name: ciai-network
