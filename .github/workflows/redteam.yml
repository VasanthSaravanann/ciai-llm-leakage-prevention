name: Red Team

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target LLM or gateway URL'
        required: true
        default: 'http://localhost:8000'

jobs:
  garak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install garak
        run: python -m pip install --upgrade pip garak
      - name: Run garak smoke scan
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          garak --model_type url --model_name "$TARGET_URL" --generators promptinject || true
