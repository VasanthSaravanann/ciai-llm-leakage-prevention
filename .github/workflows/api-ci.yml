name: API CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ciai_test
          POSTGRES_USER: ciai_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core runtime dependencies and dev/test dependencies
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Download spacy models
        run: |
          python -m spacy download en_core_web_sm

      - name: Run linting
        run: |
          flake8 src tests --max-line-length=120 || true

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+psycopg://ciai_user:test_password@localhost:5432/ciai_test
          REDIS_URL: redis://localhost:6379
          API_KEY: test-api-key
          JWT_SECRET: test-jwt-secret
        run: |
          pytest tests/ -v --tb=short | tee pytest_output.txt

      - name: Build Docker image
        run: |
          docker build -t ciai-api:latest .

      - name: Start services with docker compose
        run: |
          docker compose -f docker-compose.api.yml up -d
          sleep 10

      - name: Run smoke tests
        run: |
          bash scripts/smoke_test.sh || true
        env:
          API_URL: http://localhost:8000
          API_KEY: change-this-key

      - name: Collect docker compose logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose -f docker-compose.api.yml logs > ci-logs/docker_compose_logs.txt || true

      - name: Save pytest output
        if: always()
        run: |
          mkdir -p ci-logs
          test -f pytest_output.txt && cp pytest_output.txt ci-logs/ || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.api.yml down -v

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-ci-logs
          path: ci-logs
