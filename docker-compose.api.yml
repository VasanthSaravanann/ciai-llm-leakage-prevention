version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ciai}
      POSTGRES_USER: ${DB_USER:-ciai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ciai_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ciai_network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ciai_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_USER:-ciai_user}:${DB_PASSWORD:-changeme_strong_password}@postgres:5432/${DB_NAME:-ciai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379
      API_KEY: ${API_KEY:-change-this-key}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      GATEWAY_MODE: ${GATEWAY_MODE:-fail_closed}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-4}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers ${WORKERS:-4}
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "X-API-KEY: ${API_KEY:-change-this-key}", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ciai_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ciai_network:
    driver: bridge
